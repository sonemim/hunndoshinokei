<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>一括暗号化ツール</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body style="background:#222; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>一括暗号化ツール</h2>
  <p>以下のテキストボックスに表示されているのが、個別のパスワードで暗号化された新しい「KEYSENTENCE」です。<br>
  これをすべてコピーして、index.html に上書きしてください。</p>
  
  <textarea id="result" style="width:100%; height:500px; background:#111; color:#0f0; padding:10px; font-family:monospace;"></textarea>

  <script>
    // 今回使用する暗号化の鍵（パスワード）
   const PASSWORDS = {
        1: '桜',
        2: '睡眠',
        3: 'FOUL',
        4: 'born',
        5: '仲間',
        6: '研究',
        7: '集中',
        8: 'サヨナラ',
        9: 'EDEN',
        10: 'トラウマ',
        11: '決断',
        12: 'MAP',
        13: '悪意',
        14: 'DOLL'
};

    // あなたの書いた元の日本語ストーリー
    const originalData = {
      1: '母親が怖かった。すぐにヒステリックを起こして喚き散らす。だから、俺と弟のキョクチョウは父親のテチが大好きだった。誕生日には、のび太がプリントされた靴下をプレゼントしてくれ、当時大喜びして毎日履いていたのをよく覚えている。元気だった父親も、今は不眠に悩まされて、いつも疲れた顔をしている。そんな父親を助けてあげるために、俺ら二人は高校で一生懸命勉強をしている。',
      2: 'キョクチョウには申し訳ないと思う。しかし、一回目の臨床試験でこの技術の恐ろしさを知ってしまった。同時に、それは魅力でもある。自分が望んだ夢の世界はあまりに居心地がいい。まさしく楽園であった。それを一度体験してしまうと、現実世界の醜い部分が際立ってしまう。弟には申し訳ないが、俺はここから出ない。弟には最後に、言い遺しておこう。',
      3: 'トンビが鷹を生むとはまさにこのことで、自分と比較して息子二人はとても優秀だった。二人とも生物学や医学に興味があるらしく、最近は熱心に組織学の勉強をしている。飼っているリクガメの病気を治したいそうだ。高校でも群を抜いて成績が良いらしい。出る杭が打たれるようなことがないかが、唯一の気がかりだ。最近は睡眠障害がひどく、残り僅かな人生も、思うように生きられない。',
      4: '正直昔は、いつ死んでも良いと思っていた。しかし、癌の宣告を受けてから「死」が自分事となり、そして目の前で湯舟にヨットを浮かべてはしゃいでる息子たちの存在によって、自分事では済まないことを自覚したとき、死にたくないという極めて生物的な感情が芽生えた。窓から覗く、あのソメイヨシノもあと何度見られるのだろうか。本来、このことを家族に伝えるのが筋なのだろう。だが、多感な時期の子供たちに、自分が癌の罹患者であるという事実を伝えることが、必ずしもいいとは思えない。自分には彼らの将来を、これからの物語を、憂い、願い、祈ることしかできない。最近はうまく寝られない。',
      5: '私は自分がしたことが間違っていたとは思っていない。だが、結果的にキョクチョウには申し訳ないことをしたとも思っていた。私たちは一度話し合いをする必要がある。待ち合わせ場所の研究室にいたキョクチョウは様子が変だった。あれ以来ずっと、様子が変であったし、それは当然の反応であるのだが、今回は特別おかしかった。怒っているというわけではなさそうだ。彼は来訪者である私にエビスグサのハブ茶を出してくれた。そして彼はこう言った。「両親は高校生の頃に亡くした。これで僕にはもう、彼しかいない」  完全に虚を突かれた。意識が遠のいていく。「彼」というのが気になる。二人の親に...隠し子でも...いたのだろうか...。',
      6: '時間が解決してくれるとはよく言ったもので、人の気持ちなど、時間が経てばすぐに変化してしまう。僕も例外ではなく、ケニータが行ったことは正しかったと思い始めている自分がいて、それを認められない自分がいた。己の手で、人をひとり毒殺してしまったのだ。彼が正しかったことは初めから分かっていたはずだ。正しい行動の結果を受け入れられなかった自分が、その正当性から目を背けて、因果関係に激昂したに過ぎない。自分は一時の感情で人を殺してしまったのだ。もう僕の周りには、ソヨカゼしかいない。もう、どうしたらいいのかわからない。',
      7: '僕らが研究を進めていた、「自在に夢をみることができる技術」はついに臨床段階を迎えた。被験者として最初に名乗りを上げたのはアレクサだった。一回目の臨床試験。無事に成功した。二回目。異変が起こった。既定の時間になってもアレクサが起きない。夢からの覚醒は本人からのアクションが必要なため、外部から干渉することができない。最初は技術的な問題を疑ったが、データがそれを否定し続けた。アレクサは本人の意思で覚醒を拒否しているのだ。夢の世界に居続けるのは危険だ。20時間を超えると脳神経に損傷をきたしてしまう。24時間を超えれば命が危ない。同席していたケニータは「ナイトギア」の回路の物理的な遮断を提案した。しかし、それはリスクのある提案だった。脳の夢を司る部分は研究があまり進んでおらず、回路を物理的に遮断することで、アレクサが昏睡状態になってしまう可能性があった。',
      8: '勉強は大変だった。しかし、社会は努力に応じた楽園を用意しているわけではなく、学術界は厳しい世界だった。臨床医として現場の最前線に立つという選択肢もあったが、僕の関心は真理の探求にあったため、研究医としての道を選んだ。僕と兄のアレクサは同じ大学で「睡眠」や「夢」に関する研究をしている。父のような人を助けたいという思いで、望んで飛び込んだ世界であったものの、常に成果を求められる制度に僕らは辟易していた。研究仲間の存在は、研究本来の魅力を思い出させてくれる。ケニータはその内の一人だ。彼との議論は、行き詰った研究に度々新たな視点をもたらしてくれた。',
      9: 'この「事故」は然るべき機関によって調査された。ただ、確定していなかっただけの事実が確定しただけであった。アレクサは自らの意志で、夢の世界から出てこなかった。その事実がまざまざと突きつけられた。しかし、新たに判明した事実もある。兄は夢の世界からこちらの世界に、何らかの信号を送っていた。それは、こちらから回路を物理的に遮断したことによって、復元不可能となった。ケニータの強行手段により、兄の遺言を知る術がなくなってしまったのだ。僕はこの思いをどうしたらよいか知らなかった。ケニータを殺すこと以外に。',
      10: 'あの二人兄弟はとてもよくやっている。彼らにとって権力争いなど、塵芥のようなもののようだ。私利私欲の矢印が複雑に絡み合うこんな業界でも、ひたむきに学問の追究に邁進することはそう簡単じゃない。やはり小さい頃から二人の間で培われた独自のテンポというものがあるのだろう。感情派の弟が起爆剤の役割を担い、常に冷静な兄がその操舵をとる。そこから雨後の筍のように生まれる議論の芽は、私にいつも、学問の根源的な魅力を思い出させてくれる。特に、彼らが研究を進めている、自在に夢をみることができる装置「ナイトギア」の人体実装についての議論は印象的だった。',
      11: 'お風呂に入ると鳥肌が立つ。それがどれだけ熱い風呂であったとしても、だ。どうしても幼少期、母親から罰として入れられた、カビ臭い水風呂の記憶が蘇ってしまう。高校生となった今ではそれが虐待であったと認識できるが、当時は当たり前のことだった。何の疑いも持たず、無抵抗で、されるがままであった。それでも僕らが耐え抜くことができたのは兄弟がいたからだ。僕らはまるで三本の矢だった。三本ならそう簡単に折れることはない。',
      12: 'キョクチョウはどうにかしちまった。完全に乱心している。このままアレクサを放置しても死んでしまうだけだ。であるならば、少しでも助かる可能性のある救出作戦を実行するべきだ。これは思想どうこうの話ではない。私情を抜きにして、起きている事象を形式化し、最も客観性が担保された状態で判断を下せるのは、私しかいない。キョクチョウはもう使い物にならない。ここは私が責任をもって、すべきことをしなければならない。それが強引な手段であるとしても。',
      13: '僕はどうすればいいのか分からなくなった。このままアレクサが自らの意志で覚醒するのを待つか、一か八かの救出作戦をとるか。アレクサはこの世界に絶望して、夢の世界に閉じ籠ることを決めたのだろう。アレクサと一緒に生きてきた僕は、彼が世界からどのような仕打ちを受けてきたのかをよく知っている。そのうえで僕は、兄の決断を否定することができなかった。しかし、ケニータは彼を救出する案を主張し続けた。当たり前だ。だが、僕も譲れない。議論は、次第に罵声の応酬となった。それは暴力にまで発展した。ついに、ケニータは無理やり救出作戦を断行した。翌朝、アレクサは死んだ。見たことないくらい、安らかな死に顔だった。',
      14: '俺の弟は一度集中すると、周りの声が聞こえなくなるタイプだ。所謂、トランス状態というものだろうか。編み物に熱中していた頃は、中上5目一度だけでシャツを作成してしまっていた。出来栄えは下手くそだったが、一晩でそれを完成させていて、俺は驚愕するしかなかった。この過集中は、研究においても大いに発揮し、プロジェクトの推進力になっていた。また、弟は共感覚があるらしく、文字に色がついて見えることがあるそうだ。生まれてからずっと一緒だったが、まだ分からないことが多い。'
    };

    let outputStr = "const KEYSENTENCE = {\n";
    for (let key in originalData) {
      // 1件ずつ、PASSWORDSオブジェクト内の対応するパスワードで暗号化して文字列にする処理
      const encrypted = CryptoJS.AES.encrypt(originalData[key], PASSWORDS[key]).toString();
      outputStr += `    ${key}: '${encrypted}',\n`;
    }
    outputStr += "};";

    // 画面のテキストボックスに出力
    document.getElementById("result").value = outputStr;
  </script>
</body>
</html>
