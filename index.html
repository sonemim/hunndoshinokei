<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PROJECT | SNAP Vibe</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全体のカラー設定 --- */
        :root {
            --bg-color: #000000; /* 深い黒 */
            --surface-color: #121212; /* ウィンドウ背景 */
            --text-color: #d0d0d0; /* 明るい灰色 */
            --accent-color: #808080; /* 灰色 */
            --border-color: #444444; /* 仕切り線 */
            --divider-color: #888888; /* 明るい線 */
            --grid-color: rgba(128, 128, 128, 0.4); /* グリッド線 */
            --vignette-color: rgba(0, 0, 0, 0.95); /* 外周の暗さ */
            --scanline-dark: rgba(0, 0, 0, 0.25);
            --scanline-light: rgba(128, 128, 128, 0.06);
            --text-shadow-color: rgba(128, 128, 128, 0.5);
            --box-shadow-color: rgba(128, 128, 128, 0.4);
        }

/* ↓↓↓ bodyを丸ごと書き換え ↓↓↓ */
        body {
            background-color: var(--bg-color); /* より吸い込まれるような深い黒に */
            color: var(--text-color);
            font-family: 'DotGothic16', sans-serif;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.6;
            
            /* 異空間の網目模様（グリッド） */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            
            /* グリッドが斜めにゆっくり進むアニメーション */
            animation: gridMove 4s linear infinite;
        }

        /* ↓↓↓ bodyの下に以下を追加 ↓↓↓ */
        
        /* グリッドを動かす仕組み */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* 画面の四隅を暗くしてモニターのような奥行きを出す（ビネット効果） */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 30%, var(--vignette-color) 100%);
            pointer-events: none;
            z-index: 998; /* scanlinesのすぐ下に配置 */
        }
        /* ↑↑↑ ここまで追加 ↑↑↑ */

        /* --- ブラウン管（CRT）の走査線エフェクト --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, var(--scanline-dark) 50%), 
                        linear-gradient(90deg, var(--scanline-light), var(--scanline-light), var(--scanline-light));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; /* クリックの邪魔にならないようにする */
            z-index: 999;
        }

        /* --- メインコンテンツ --- */
        main {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- リンクのスタイル --- */
        a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-color);
        }

        a:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- 疑似ウィンドウの基本スタイル --- */
        .fake-window {
            position: absolute; /* 画面上の自由な位置に配置 */
            background-color: var(--surface-color);
            border: 2px solid var(--accent-color);
            width: 280px;
            box-shadow: 4px 4px 0px var(--box-shadow-color); /* レトロな影 */
            z-index: 100;
        }

        /* ウィンドウ上部のバー */
        .window-header {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 4px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
        }

        /* バツボタン */
        .close-btn {
            cursor: pointer;
        }

        .window-content {
            padding: 0;
            font-size: 0.9rem;
        }

        .window-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .window-footer {
            padding: 10px 15px 15px;
            border-top: 1px solid var(--border-color);
            background: rgba(128, 128, 128, 0.08);
        }

        .window-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* --- それぞれのウィンドウの配置場所 --- */
        .window-1 {
            top: 25%;
            left: 10%;
        }

        .window-2 {
            top: 40%;
            right: 15%;
        }

        .window-3 {
            top: 60%; 
            left: 35%;
        }
        
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <main>
        <!-- 疑似ウィンドウ 1 -->
        <div class="fake-window window-1">
            <div class="window-header">
                <span>SYSTEM_ALERT.exe</span>
                <span class="close-btn">×</span>
            </div>
                <div class="window-content">
                <img class="window-image" src="test1.jpg" alt="window 1 image">
            </div>
            <div class="window-footer">
                <a href="?page=1">詳細ページへ</a>
            </div>
        </div>

        <!-- 疑似ウィンドウ 2 -->
        <div class="fake-window window-2">
            <div class="window-header">
                <span>IMAGE_VIEWER</span>
                <span class="close-btn">×</span>
            </div>
            <div class="window-content">
                <img class="window-image" src="test2.jpg" alt="window 2 image">
            </div>
            <div class="window-footer">
                <a href="?page=2">詳細ページへ</a>
            </div>
        </div>
        <!-- ↓↓↓ 追加：疑似ウィンドウ 3 ↓↓↓ -->
        <div class="fake-window window-3">
            <div class="window-header">
                <span>NEW_PROCESS.bat</span>
                <span class="close-btn">×</span>
            </div>
            <div class="window-content">
                <img class="window-image" src="test3.jpg" alt="window 3 image">
            </div>
            <div class="window-footer">
                <a href="?page=3">詳細ページへ</a>
            </div>
        </div>
        <!-- ↑↑↑ ここまで ↑↑↑ -->
    </main>

<script>
        // 画面内のすべての「疑似ウィンドウ」を取得
        const windows = document.querySelectorAll('.fake-window');

        windows.forEach(win => {
            const header = win.querySelector('.window-header');
            
            let isDragging = false;
            let offsetX = 0;
            let offsetY = 0;

            // 1. ヘッダーの上でマウスのボタンが押し込まれた時
            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                header.style.cursor = 'grabbing'; // つかんでいる手のアイコンに変更

                // 【超重要】ドラッグ開始時に right と bottom のCSS指定を強制解除！
                // これにより、どのウィンドウをつかんでもサイズが伸びなくなります。
                win.style.right = 'auto';
                win.style.bottom = 'auto';

                // マウスの位置とウィンドウの左上の角とのズレを計算して記憶
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                // つかんだウィンドウを一番手前（一番上）に持ってくる
                windows.forEach(w => w.style.zIndex = 100);
                win.style.zIndex = 101;
            });

            // 2. マウスが画面内を動いている時
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return; // つかんでいない時は何もしない

                // 記憶したズレを引いて、ウィンドウの新しい位置を決定
                // ※ window.scrollX / scrollY を足すことでスクロールズレを防止
                win.style.left = (e.clientX - offsetX + window.scrollX) + 'px';
                win.style.top = (e.clientY - offsetY + window.scrollY) + 'px';
            });

            // 3. マウスのボタンを離した時
            document.addEventListener('mouseup', () => {
                isDragging = false;
                header.style.cursor = 'grab'; // 元の手のアイコンに戻す
            });
        });
    </script>
</body>
</html>
