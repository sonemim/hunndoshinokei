    <style>
        /* --- 全体のカラー設定 --- */
        :root {
            --bg-color: #000000; /* 深い黒 */
            --surface-color: #121212; /* ウィンドウ背景 */
            --text-color: #d0d0d0; /* 明るい灰色 */
            --accent-color: #808080; /* 灰色 */
            --border-color: #444444; /* 仕切り線 */
            --divider-color: #888888; /* 明るい線 */
            --grid-color: rgba(128, 128, 128, 0.4); /* グリッド線 */
            --vignette-color: rgba(0, 0, 0, 0.95); /* 外周の暗さ */
            --scanline-dark: rgba(0, 0, 0, 0.25);
            --scanline-light: rgba(128, 128, 128, 0.06);
            --text-shadow-color: rgba(128, 128, 128, 0.5);
            --box-shadow-color: rgba(128, 128, 128, 0.4);
            --success-color: #228B22; /* 成功時の緑 */
            --error-color: #DC143C; /* エラー時の赤 */
        }

/* ↓↓↓ bodyを丸ごと書き換え ↓↓↓ */
        body {
            background-color: var(--bg-color); /* より吸い込まれるような深い黒に */
            color: var(--text-color);
            font-family: 'DotGothic16', sans-serif;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.6;
            
            /* 異空間の網目模様（グリッド） */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            
            /* グリッドが斜めにゆっくり進むアニメーション */
            animation: gridMove 4s linear infinite;
        }

        /* ↓↓↓ bodyの下に以下を追加 ↓↓↓ */
        
        /* グリッドを動かす仕組み */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* 画面の四隅を暗くしてモニターのような奥行きを出す（ビネット効果） */
        /* --- メインコンテンツ --- */
        main {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- リンクのスタイル --- */
        a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-color);
        }

        a:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- ウィンドウのポップアップアニメーション --- */
        @keyframes popIn {
            0% {
                transform: scale(0.1);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* --- 疑似ウィンドウの基本スタイル --- */
        .fake-window {
            position: absolute; /* 画面上の自由な位置に配置 */
            background-color: var(--surface-color);
            border: 2px solid var(--accent-color);
            width: 280px;
            height: auto;
            box-shadow: 4px 4px 0px var(--box-shadow-color); /* レトロな影 */
            z-index: 100;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: center center;
            opacity: 0;
            transform: scale(0.1);
        }

        /* ウィンドウ上部のバー */
        .window-header {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 4px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            touch-action: none; /* タッチでのドラッグを扱う（ページスクロールと競合しないように） */
        }

        /* バツボタン */
        .close-btn {
            cursor: pointer;
        }
 
        .window-content {
            padding: 0;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
        }

        .window-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        .window-content.unlocked .window-image {
            opacity: 0;
        }

        .revealed-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 24px);
            padding: 10px 12px;
            color: var(--text-color);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.4;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            pointer-events: none;
        }

        .window-content.unlocked .revealed-text {
            opacity: 1;
            visibility: visible;
        }

        .window-footer {
            padding: 10px 15px 15px;
            border-top: 1px solid var(--border-color);
            background: rgba(128, 128, 128, 0.08);
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .window-footer input {
            flex: 1;
            padding: 5px 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--accent-color);
            font-family: 'DotGothic16', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .window-footer input.error {
            border-color: var(--error-color);
        }

        .window-footer button {
            padding: 5px 10px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: 1px solid var(--border-color);
            font-family: 'DotGothic16', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .window-footer button:active {
            background-color: var(--text-color);
        }

        .window-footer input:disabled {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(128, 128, 128, 0.6);
            color: rgba(208, 208, 208, 0.7);
        }

        .window-footer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .window-header.success {
            background-color: var(--success-color);
        }

        /* リサイズハンドル */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border: 1px solid var(--text-color);
            cursor: pointer;
            z-index: 102;
            touch-action: none; /* ハンドル上のタッチ操作を専有する */
        }

        .resize-handle.top-left {
            top: -6px;
            left: -6px;
            cursor: nwse-resize;
        }

        .resize-handle.top-right {
            top: -6px;
            right: -6px;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-left {
            bottom: -6px;
            left: -6px;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-right {
            bottom: -6px;
            right: -6px;
            cursor: nwse-resize;
        }

    const TITLES = {
        1: 'father.hlc',
        2: 'determination.hlc',
        3: 'anxiety.hlc',
        4: 'prayer.hlc',
        5: 'execution.hlc',
        6: 'ending.hlc',
        7: 'incident.hlc',
        8: 'academy.hlc',
        9: 'intent.hlc',
        10: 'gear.hlc',
        11: 'goosebumps.hlc',
        12: 'responsibility.hlc',
        13: 'calm.hlc',
        14: 'zone.hlc'
    };

    const windows = document.querySelectorAll('.fake-window');

    // ウィンドウのポップアップアニメーション設定（2.5秒で順次表示）
    const POPUP_DURATION = 2500; // ミリ秒
    const WINDOW_COUNT = windows.length;
    const delayPerWindow = POPUP_DURATION / (WINDOW_COUNT - 1);

    windows.forEach((win, index) => {
        const delay = index * delayPerWindow;
        win.style.animationDelay = delay + 'ms';
    });

    windows.forEach(win => {
        const header = win.querySelector('.window-header');
        const handles = win.querySelectorAll('.resize-handle');
        
        let isDragging = false;
        let dragPointerId = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let isResizing = false;
        let resizePointerId = null;
        let resizeCorner = null;
        let resizingHandle = null;

        let initialHandleX = 0;
        let initialHandleY = 0;
        let initialX = 0;
        let initialY = 0;
        let initialWidth = 0;
        let initialHeight = 0;

        // ドラッグ開始（pointer対応）
        header.addEventListener('pointerdown', (e) => {
            if (e.button && e.button !== 0) return; // 非メインボタンは無視
            isDragging = true;
            dragPointerId = e.pointerId;
            try { header.setPointerCapture(dragPointerId); } catch (err) {}

            win.style.right = 'auto';
            win.style.bottom = 'auto';

            const rect = win.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            windows.forEach(w => w.style.zIndex = 100);
            win.style.zIndex = 101;
        });

        // リサイズ開始（pointer対応）
        handles.forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                isResizing = true;
                resizePointerId = e.pointerId;
                resizingHandle = handle;
                try { handle.setPointerCapture(resizePointerId); } catch (err) {}

                resizeCorner = Array.from(handle.classList).find(c => 
                    c.match(/top-left|top-right|bottom-left|bottom-right/)
                );

                win.style.right = 'auto';
                win.style.bottom = 'auto';

                const rect = win.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                initialWidth = rect.width;
                initialHeight = rect.height;

                const handleRect = handle.getBoundingClientRect();
                initialHandleX = handleRect.left + handleRect.width / 2;
                initialHandleY = handleRect.top + handleRect.height / 2;

                windows.forEach(w => w.style.zIndex = 100);
                win.style.zIndex = 101;
            });
        });

        // pointermove でドラッグまたはリサイズを処理
        document.addEventListener('pointermove', (e) => {
            if (isDragging && !isResizing && e.pointerId === dragPointerId) {
                const newLeft = e.clientX - dragOffsetX + window.scrollX;
                const newTop = e.clientY - dragOffsetY + window.scrollY;
                win.style.left = newLeft + 'px';
                win.style.top = newTop + 'px';
            }

            if (isResizing && e.pointerId === resizePointerId) {
                // ハンドルの初期位置からのマウス移動量を計算
                const deltaX = e.clientX - initialHandleX;
                const deltaY = e.clientY - initialHandleY;

                let newWidth = initialWidth;
                let newHeight = initialHeight;
                let newLeft = initialX;
                let newTop = initialY;

                // コーナーごとのリサイズロジック（ハンドルから外方向＝拡大、内方向＝縮小）
                if (resizeCorner === 'bottom-right') {
                    newWidth = Math.max(MIN_WIDTH, initialWidth + deltaX);
                    newHeight = Math.max(MIN_HEIGHT, initialHeight + deltaY);
                } else if (resizeCorner === 'bottom-left') {
                    newWidth = Math.max(MIN_WIDTH, initialWidth - deltaX);
                    newHeight = Math.max(MIN_HEIGHT, initialHeight + deltaY);
                    newLeft = initialX + deltaX;
                } else if (resizeCorner === 'top-right') {
                    newWidth = Math.max(MIN_WIDTH, initialWidth + deltaX);
                    newHeight = Math.max(MIN_HEIGHT, initialHeight - deltaY);
                    newTop = initialY + deltaY;
                } else if (resizeCorner === 'top-left') {
                    newWidth = Math.max(MIN_WIDTH, initialWidth - deltaX);
                    newHeight = Math.max(MIN_HEIGHT, initialHeight - deltaY);
                    newLeft = initialX + deltaX;
                    newTop = initialY + deltaY;
                }

                win.style.width = newWidth + 'px';
                win.style.height = newHeight + 'px';
                win.style.left = newLeft + 'px';
                win.style.top = newTop + 'px';
            }
        });

        // pointerup / pointercancel で状態解除
        document.addEventListener('pointerup', (e) => {
            if (isDragging && e.pointerId === dragPointerId) {
                isDragging = false;
                try { header.releasePointerCapture(dragPointerId); } catch (err) {}
                dragPointerId = null;
                header.style.cursor = 'grab';
            }

            if (isResizing && e.pointerId === resizePointerId) {
                isResizing = false;
                try { resizingHandle && resizingHandle.releasePointerCapture(resizePointerId); } catch (err) {}
                resizePointerId = null;
                resizingHandle = null;
            }
        });

        document.addEventListener('pointercancel', (e) => {
            if (isDragging && e.pointerId === dragPointerId) {
                isDragging = false;
                dragPointerId = null;
                header.style.cursor = 'grab';
            }
            if (isResizing && e.pointerId === resizePointerId) {
                isResizing = false;
                resizePointerId = null;
                resizingHandle = null;
            }
        });

        // キーワード検証と状態表示
        const keywordInput = win.querySelector('.keyword-input');
        const submitBtn = win.querySelector('.submit-btn');
        const windowClass = Array.from(win.classList).find(c => c.startsWith('window-'));
        const windowId = windowClass ? windowClass.split('-')[1] : null;

        if (windowId) {
            const titleSpan = header.querySelector('span');
            if (titleSpan) {
                titleSpan.textContent = TITLES[windowId] || titleSpan.textContent;
            }
        }

        if (keywordInput && submitBtn && windowId) {
            submitBtn.addEventListener('click', () => {
                const value = keywordInput.value.trim();
                keywordInput.classList.remove('error');

                if (!value) {
                    keywordInput.classList.add('error');
                    setTimeout(() => keywordInput.classList.remove('error'), 1200);
                    return;
                }

                try {
                    const decrypted = CryptoJS.AES.decrypt(KEYSENTENCE[windowId], value);
                    const decryptedText = decrypted.toString(CryptoJS.enc.Utf8);

                    if (decryptedText) {
                        header.classList.add('success');
                        const content = win.querySelector('.window-content');
                        const revealedText = content.querySelector('.revealed-text');
                        revealedText.textContent = decryptedText;
                        content.classList.add('unlocked');
                        keywordInput.value = '';
                        keywordInput.disabled = true;
                        submitBtn.disabled = true;
                    } else {
                        throw new Error('Decryption failed');
                    }
                } catch (e) {
                    keywordInput.classList.add('error');
                    setTimeout(() => keywordInput.classList.remove('error'), 1200);
                }
            });

            keywordInput.addEventListener('input', () => {
                keywordInput.classList.remove('error');
            });
        }
    });
